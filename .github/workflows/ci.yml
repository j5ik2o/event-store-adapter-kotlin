name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
jobs:
  release-checks:
    name: Release automation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify conformance data v1.0.0
        run: |
          python3 tools/conformance/manifest.py verify
          echo "61c26614dbbfba88eebce72cc1d2b0220218839e74dcfb64c19268f7ee2302ce  conformance/manifest.json" | sha256sum -c -
      - run: python3 -m unittest discover -s .github/tests -v
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false
      - name: Check workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    name: "Run lint"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck --info
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      TEST_TIME_FACTOR: 3
    strategy:
      matrix:
        java: [ 11, 17, 19 ] # LTS versions + latest version
    name: "Run tests with JDK ${{ matrix.java }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Install compilation/test toolchains; the last JDK runs Gradle.
          java-version: |
            11
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test -PtestJavaVersion=${{ matrix.java }} --info
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, test, release-checks]
    if: always()
    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_CHECKS_RESULT: ${{ needs.release-checks.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" || "$RELEASE_CHECKS_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test=$TEST_RESULT, release-checks=$RELEASE_CHECKS_RESULT"
            exit 1
          fi
