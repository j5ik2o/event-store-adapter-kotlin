name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
jobs:
  release-checks:
    name: Release automation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Verify conformance data v1.3.0
        run: |
          python3 tools/conformance/manifest.py verify
          echo "0157c012042afa9a19f0bff509a433a4bd5ddc5b674de864a41bec453c460691  conformance/manifest.json" | sha256sum -c -
      - name: Verify user documentation
        run: |
          echo "95c189b5e7c0f65967d366d6b0060e7f66d9cc5df7158a382f69750e40d1b37d  user-docs/template.json" | sha256sum -c -
          echo "104386e9257a05cf8766e12e43e89fe5ff2328b9601c0a24e421c12e76df29dd  tools/user-docs/check.py" | sha256sum -c -
          python3 tools/user-docs/check.py
      - name: Verify API surface 0.1.0
        run: |
          echo "37c91f8f94e10c73513a9c1deef990ea4deea96d5001ae700d6bf799658d0e32  api-surface/surface.json" | sha256sum -c -
      - run: python3 -m unittest discover -s .github/tests -v
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Check workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    name: "Run lint"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck --info
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      TEST_TIME_FACTOR: 3
    strategy:
      matrix:
        java: [ 11, 17, 19 ] # LTS versions + latest version
    name: "Run tests with JDK ${{ matrix.java }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Install compilation/test toolchains; the last JDK runs Gradle.
          java-version: |
            11
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Pull the Cloud Spanner emulator image
        # Pinned by digest, as in SpannerEmulator. The Spanner tests and the required
        # Spanner conformance cases fail the build when they cannot run.
        run: docker pull gcr.io/cloud-spanner-emulator/emulator:1.5.58@sha256:c6f3402f2599684f295a0fdefb6fbbbfb18a0e43e309ff5456ccb452a4570a79
      - name: Pull the Cloud Bigtable emulator image
        # Pinned by digest, as in BigtableEmulator. The Bigtable tests and the required
        # Bigtable conformance cases fail the build when they cannot run.
        run: docker pull gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:8d8573471c489a409f03891d2c24d177fa531276184f7002b9a2d853d1b3ed54
      - run: ./gradlew test -PtestJavaVersion=${{ matrix.java }} --info
      - name: Write per-rule conformance table to job summary
        if: ${{ !cancelled() }}
        run: |
          report=build/reports/conformance/report.json
          test -f "$report" || { echo "missing $report"; exit 1; }
          jq -r '
            def statuses: ["passed","failed","not-applicable","unverified","unrepresentable"];
            .rules as $rules
            | "## Conformance by rule (JDK ${{ matrix.java }})\n",
              ( [$rules[].backend] | unique[] ) as $b
            | "### \($b)\n",
              "| rule | passed | failed | not-applicable | unverified | unrepresentable | reason (not-applicable / unrepresentable) |",
              "|---|---|---|---|---|---|---|",
              ( [$rules[] | select(.backend == $b)] | group_by(.rule)[]
                | . as $g
                | "| \($g[0].rule) | "
                  + ( statuses | map(. as $s | [$g[] | select(.status == $s)] | length | tostring) | join(" | ") )
                  + " | "
                  + ( [$g[] | select(.status == "not-applicable" or .status == "unrepresentable") | .reason] | unique | join("; ") | gsub("\\|"; "\\|") | gsub("\n"; " ") )
                  + " |" ),
              ""
          ' "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report-jdk${{ matrix.java }}
          path: |
            build/reports/conformance/report.json
            build/reports/conformance/summary.md
          if-no-files-found: error
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, test, release-checks]
    if: always()
    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_CHECKS_RESULT: ${{ needs.release-checks.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" || "$RELEASE_CHECKS_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test=$TEST_RESULT, release-checks=$RELEASE_CHECKS_RESULT"
            exit 1
          fi
